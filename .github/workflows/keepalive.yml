name: Keepalive

# GitHub отключает расписания после 60 дней без коммитов. Раз в месяц этот
# workflow делает пустой коммит, и расписание лид-финдера остаётся активным.
on:
  schedule:
    - cron: "0 3 1 * *" # 1-е число, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive file
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive: $(date -u +%Y-%m)" || exit 0
          git push
